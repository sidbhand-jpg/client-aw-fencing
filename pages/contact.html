<!doctype html>
<html lang="en">
<head>
  <!-- ── CONFIG (loaded early for Meta Pixel) ──────────────────── -->
  <script src="../CONFIG.js"></script>
  <!-- ── Meta Pixel Base Code (reads CONFIG.metaPixelId) ───────── -->
  <script>
  (function() {
    if (!CONFIG.metaPixelId) return;
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', CONFIG.metaPixelId);
    fbq('track', 'PageView');
    document.write('<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=' + CONFIG.metaPixelId + '&ev=PageView&noscript=1"/></noscript>');
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/public/brand/aw-fencing-logo.png" />
  <title>Contact | Get Free Estimate</title>
  <meta name="description" content="Contact A&W Fencing to discuss your fence project and request a free estimate." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<!-- ── CONTACT HERO ───────────────────────────────────────────── -->
<section class="page-hero" style="background-color:var(--color-secondary); padding-bottom: 5rem;">
  <div class="grid-overlay"></div>
  <div class="container-wide" style="position:relative">
    <div class="page-hero-eyebrow">Contact Us</div>
    <h1 style="color:#fff; margin-bottom: 1rem;">Get Free Estimate</h1>
    <p style="color:rgba(255,255,255,0.8); font-size:1.125rem; max-width:42rem; line-height:1.65;">
      Tell us about your fence project in the chat widget or call us directly.
    </p>
  </div>
</section>

<!-- ── CONTACT CONTENT ────────────────────────────────────────── -->
<section class="section-y bg-white">
  <div class="container-wide contact-grid">

    <!-- Left: info cards -->
    <div class="contact-info-col">
      <h2 class="contact-info-heading">Talk to A&W Fencing</h2>
      <p class="contact-info-sub">Choose how you'd like to get started.</p>
      <a href="#chat-widget" class="btn-primary" data-open-chat>Get Free Estimate</a>

      <div class="contact-cards">
        <!-- Phone -->
        <a href="#" class="contact-card" id="contact-phone-card">
          <div class="contact-card-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="contact-card-icon"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.09 12a19.79 19.79 0 01-3-8.63A2 2 0 012.11 1.18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.27a16 16 0 006.29 6.29l1.45-1.45a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 15.36z"/></svg>
          </div>
          <div>
            <div class="contact-card-label">Call Us</div>
            <div class="contact-card-value" id="contact-phone-display"></div>
            <div class="contact-card-note">Tap to call</div>
          </div>
        </a>

        <!-- Location -->
        <div class="contact-card">
          <div class="contact-card-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="contact-card-icon"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div>
            <div class="contact-card-label">Business Base</div>
            <div class="contact-card-value" id="contact-city-display"></div>
            <div class="contact-card-note">Serving Charlotte and surrounding communities</div>
          </div>
        </div>
      </div>

    </div>

  </div>
</section>

<!-- ── MAP ────────────────────────────────────────────────────── -->
<section class="section-y bg-slate-50">
  <div class="container-wide" style="max-width:56rem;margin-inline:auto;">
    <div id="contact-map-header"></div>
    <div id="contact-map"></div>
  </div>
</section><script src="../components.js"></script><script src="/generic-runtime.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.title = `Contact A&W Fencing | Request a Fence Estimate`;

  // Fill contact info
  const phoneCard = document.getElementById('contact-phone-card');
  phoneCard.href = `tel:${CONFIG.phoneRaw}`;
  document.getElementById('contact-phone-display').textContent = CONFIG.phone;

  document.getElementById('contact-city-display').textContent = CONFIG.city;

  // Map
  document.getElementById('contact-map-header').innerHTML = sectionHeaderHTML({
    eyebrow: 'Service Coverage',
    title: `Serving Charlotte & Surrounding Communities`,
    subtitle: 'Contact us to discuss availability in your area.'
  });
  document.getElementById('contact-map').innerHTML = mapEmbedHTML('Charlotte NC');
});
</script>

<style>
/* ── CONTACT PAGE STYLES ────────────────────────────────── */
.contact-grid {
  display: flex;
  flex-direction: column;
  gap: 3rem;
}
@media (min-width: 1024px) {
  .contact-grid { flex-direction: row; gap: 4rem; }
}
.contact-info-col { flex: 1; }
.contact-form-col { flex: 1; max-width: 36rem; }

.contact-info-heading {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--color-navy);
  margin-bottom: 0.75rem;
}
.contact-info-sub {
  font-size: 1rem;
  color: var(--color-muted);
  line-height: 1.65;
  margin-bottom: 2rem;
}

.contact-cards { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
.contact-card {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  padding: 1.25rem;
  background: var(--color-slate-50);
  border: 1px solid var(--color-slate-200);
  border-radius: var(--radius-xl);
  text-decoration: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.contact-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); }
.contact-card-icon-wrap {
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 0.625rem;
  background-color: var(--color-primary);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.contact-card-icon { width: 1.25rem; height: 1.25rem; color: #fff; }
.contact-card-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-muted); }
.contact-card-value { font-family: var(--font-display); font-weight: 600; color: var(--color-navy); font-size: 1rem; margin-top: 0.125rem; }
.contact-card-note { font-size: 0.75rem; color: var(--color-muted); margin-top: 0.125rem; }

.contact-trust-list { display: flex; flex-direction: column; gap: 0.75rem; }
.contact-trust-item { display: flex; align-items: center; gap: 0.625rem; font-size: 0.9375rem; color: var(--color-navy); font-weight: 500; }
.contact-trust-check { width: 1.25rem; height: 1.25rem; color: var(--color-primary); flex-shrink: 0; }
</style>

</body>
</html>
