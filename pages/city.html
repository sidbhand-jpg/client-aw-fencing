<!doctype html>
<html lang="en">
<head>
  <!-- ── CONFIG (loaded early for Meta Pixel) ──────────────────── -->
  <script src="../CONFIG.js"></script>
  <!-- ── Meta Pixel Base Code (reads CONFIG.metaPixelId) ───────── -->
  <script>
  (function() {
    if (!CONFIG.metaPixelId) return;
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', CONFIG.metaPixelId);
    fbq('track', 'PageView');
    document.write('<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=' + CONFIG.metaPixelId + '&ev=PageView&noscript=1"/></noscript>');
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/public/brand/aw-fencing-logo.png" />
  <title>Home Services | City</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=optional" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

<!-- ── CITY HERO ─────────────────────────────────────────────── -->
<section class="page-hero city-hero" id="city-hero">
  <div class="grid-overlay"></div>
  <div class="container-wide city-hero-inner">
    <div class="flex-1">
      <div class="page-hero-eyebrow" id="city-eyebrow">{{CITY_EYEBROW}}</div>
      <h1 class="city-headline" id="city-headline">{{CITY_H1}}</h1>
      <p class="city-sub" id="city-sub">{{CITY_INTRO}}</p>
      <div class="city-service-pills" id="city-service-pills">{{CITY_SERVICES}}</div>
      <div class="cta-btns city-estimate-actions">
        <a href="#chat-widget" class="btn-primary btn-lg" data-open-chat>Get Free Estimate</a>
        <a href="tel:{{PHONE_RAW}}" class="btn-outline btn-lg" id="city-phone-link"><span id="city-phone-text">{{PHONE}}</span></a>
      </div>
      <div class="city-rating" hidden>
        <div class="stars" id="city-stars"></div>
        <span class="city-rating-text" id="city-rating-text"></span>
      </div>
    </div>
  </div>
</section>

<!-- ── WHY US IN THIS CITY ────────────────────────────────────── -->
<section class="section-y bg-white">
  <div class="container-wide">
    <div id="city-why-header">{{CITY_WHY_HEADER}}</div>
    <div class="city-why-grid" id="city-why-grid">{{CITY_WHY_GRID}}</div>
  </div>
</section>

<!-- ── MAP ───────────────────────────────────────────────────── -->
<section class="section-y bg-slate-50">
  <div class="container-wide" style="max-width: 56rem; margin-inline: auto;">
    <div id="city-map-header">{{CITY_MAP_HEADER}}</div>
    <div id="city-map">{{CITY_MAP}}</div>
  </div>
</section>

<!-- ── CITY FAQs ──────────────────────────────────────────────── -->
<section class="section-y bg-white">
  <div class="container-wide">
    <div id="city-faq-header">{{CITY_FAQ_HEADER}}</div>
    <div id="city-faq-container">{{CITY_FAQS}}</div>
  </div>
</section>

<!-- ── CTA ────────────────────────────────────────────────────── -->
<div id="city-cta">{{CITY_CTA}}</div><script src="../components.js"></script>


<style>
/* ── CITY PAGE STYLES ─────────────────────────────────────── */
.city-hero { padding-bottom: 5rem; }
.city-hero-inner {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3rem;
  align-items: flex-start;
}
@media (min-width: 1024px) {
  .city-hero-inner { flex-direction: row; align-items: flex-start; }
}
.flex-1 { flex: 1; }
.city-headline { color: #fff; font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 1.25rem; }
.city-sub { color: rgba(255,255,255,0.8); font-size: 1.125rem; max-width: 36rem; line-height: 1.65; margin-bottom: 2rem; }
.city-service-pills { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 2rem; }
.city-service-pill {
  display: inline-block;
  padding: 0.5rem 1rem;
  border-radius: 9999px;
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.9);
  font-size: 0.875rem;
  text-decoration: none;
  transition: background 0.15s;
}
.city-service-pill:hover { background: rgba(255,255,255,0.1); }
.city-rating { display: flex; align-items: center; gap: 0.75rem; }
.city-rating-text { color: rgba(255,255,255,0.8); font-size: 0.875rem; }
.city-form-col { width: 100%; max-width: 22rem; }

/* Why grid */
.city-why-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; max-width: 56rem; margin-inline: auto; }
@media (min-width: 768px) { .city-why-grid { grid-template-columns: repeat(2, 1fr); } }
.city-why-item {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 1rem;
  background: var(--color-slate-50);
  border-radius: 0.75rem;
  border: 1px solid var(--color-slate-200);
}
.city-why-item span { color: var(--color-navy); font-weight: 500; }
.why-check { width: 1.25rem; height: 1.25rem; color: var(--color-primary); flex-shrink: 0; margin-top: 0.125rem; }
</style>

</body>
</html>
