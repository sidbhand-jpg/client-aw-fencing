<section class="section-y bg-white">

      <a href="#chat-widget" class="btn-primary" data-open-chat>Get Free Estimate</a>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.title = `Contact A&W Fencing | Request a Fence Estimate`;

  // Fill contact info
  const phoneCard = document.getElementById('contact-phone-card');
  phoneCard.href = `tel:${CONFIG.phoneRaw}`;
  document.getElementById('contact-phone-display').textContent = CONFIG.phone;

  document.getElementById('contact-city-display').textContent = CONFIG.city;

  // Map
  document.getElementById('contact-map-header').innerHTML = sectionHeaderHTML({
    eyebrow: 'Service Coverage',
    title: `Serving Charlotte & Surrounding Communities`,
    subtitle: 'Contact us to discuss availability in your area.'
  });
  document.getElementById('contact-map').innerHTML = mapEmbedHTML('Charlotte NC');
});
</script>

.contact-info-heading {

  margin-bottom: 0.75rem;
}

  font-size: 1rem;
  color: var(--color-muted);
  line-height: 1.65;
  margin-bottom: 2rem;
}

.contact-cards { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
.contact-card {
  display: flex;
  align-items: flex-start;

  border-radius: var(--radius-xl);

}

  width: 2.75rem;

.contact-card-icon { width: 1.25rem; height: 1.25rem; color: #fff; }
